language: node_js
node_js:
  - "18"
addons:
  postgresql: "14"
services:
  - postgresql
before_install:
  - sudo apt-get -qq update
  - sudo apt-get install postgresql-14-postgis-3
before_script:
  - psql -U postgres -c 'create database "bookshelf-geojson";'
  - psql -U postgres -c 'create extension postgis;' bookshelf-geojson
  - npm run migrate
after_success:
  - npm run test:coveralls
